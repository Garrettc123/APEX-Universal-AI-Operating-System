name: Auto-Provision Secrets
# Manually populate the repository's Actions secrets required by deploy.yml.
# The values are read from a JSON blob passed as a workflow input (marked as a
# secret by the runner UI). Values never appear in logs.
#
# Required token: a PAT with `repo` scope stored as `GH_PROVISION_TOKEN`
# (a workflow's own GITHUB_TOKEN CANNOT write repo secrets).

on:
  workflow_dispatch:
    inputs:
      secrets_json:
        description: 'JSON object of {SECRET_NAME: value} pairs. Treated as secret.'
        required: true
        type: string
      allow_missing:
        description: 'Skip missing required secrets instead of failing'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  provision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --quiet requests pynacl

      - name: Materialize secrets JSON to env-file
        env:
          SECRETS_JSON: ${{ inputs.secrets_json }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          data = json.loads(os.environ["SECRETS_JSON"])
          if not isinstance(data, dict):
              raise SystemExit("secrets_json must be a JSON object")
          lines = [f'{k}={v}' for k, v in data.items() if isinstance(v, str)]
          pathlib.Path(".env.provision").write_text("\n".join(lines) + "\n")
          print(f"loaded {len(lines)} keys")
          PY

      - name: Provision secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PROVISION_TOKEN }}
        run: |
          python scripts/auto_provision_secrets.py \
            --repo "${{ github.repository }}" \
            --env-file .env.provision \
            ${{ inputs.allow_missing == 'true' && '--allow-missing' || '' }}

      - name: Cleanup
        if: always()
        run: rm -f .env.provision
